apiVersion: apps/v1
kind: Deployment
metadata:
  name: intranet-newdeal
  namespace: default
  labels:
    app: intranet-newdeal
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intranet-newdeal
  template:
    metadata:
      labels:
        app: intranet-newdeal
        version: v1
    spec:
      containers:
      - name: intranet-newdeal
        image: madara3/intranet-newdeal:1.0.0
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: intranet-newdeal-service
  namespace: default
  labels:
    app: intranet-newdeal
spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    protocol: TCP
    name: http
  selector:
    app: intranet-newdeal
